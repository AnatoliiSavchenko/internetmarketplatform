name: Deploy Internet Market Platform™

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-google-cloud:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Google Cloud Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
        
    - name: Deploy API Bridge to GCP
      run: |
        echo "Deploying Internet Market Platform™ to Google Cloud..."
        # Команда розгортання Google Cloud Run
        gcloud run deploy imp-gemini-bridge --source . --region europe-west3

  notify-gemashield-nodes:
    runs-on: ubuntu-latest
    needs: deploy-to-google-cloud
    steps:
    - name: Sync Hetzner Nodes
      run: |
        echo "Syncing Node 178.104.47.55 and 46.225.136.8 with new GitHub code..."
        # Тут GitHub подає сигнал на ваші сервери для оновлення протоколів
        curl -X POST http://46.225.136.8:5000/api/v5/global/update -d '{"source": "github"}'
